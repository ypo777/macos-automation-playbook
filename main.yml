---
- hosts: all

  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Include playbook configuration.
      include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
      tags: ['always']

    - import_tasks: tasks/dotfiles-prep.yml
      when: configure_dotfiles
      tags: ['dotfiles', 'dotfiles-prep']

  roles:
    - role: elliotweiser.osx-command-line-tools
    - role: geerlingguy.mac.homebrew
      tags: ['homebrew']
    - role: geerlingguy.dotfiles
      when: configure_dotfiles
      tags: ['dotfiles']
    - role: geerlingguy.mac.mas
      when: mas_installed_apps
      tags: ['mas']
    - role: geerlingguy.mac.dock
      when: configure_dock
      tags: ['dock']

  tasks:
    - import_tasks: tasks/sudoers.yml
      when: configure_sudoers
      tags: ['sudoers']

    - import_tasks: tasks/macos.yml
      when: configure_osx
      tags: ['osx']

    - import_tasks: tasks/extra-packages.yml
      tags: ['extra-packages']

    - name: Run configured post-provision ansible task files.
      include_tasks: "{{ outer_item }}"
      loop_control:
        loop_var: outer_item
      with_fileglob: "{{ post_provision_tasks|default(omit) }}"
      tags: ['post']

  handlers:
    - name: Restart Finder
      become: false
      command: killall Finder
      failed_when: false
      changed_when: false

    - name: Restart Dock
      become: false
      command: killall Dock
      failed_when: false
      changed_when: false

    - name: Restart SystemUIServer
      become: false
      command: killall SystemUIServer
      failed_when: false
      changed_when: false

    - name: Restart WindowManager
      become: false
      command: killall WindowManager
      failed_when: false
      changed_when: false
