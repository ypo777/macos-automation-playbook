---
- name: Check if config directories exist
  stat:
    path: "{{ dotfiles_home }}/.config/{{ item }}"
  register: config_dir_stats
  with_items: "{{ dotfiles_folder }}"
  tags: ['dotfiles-prep']

- name: Backup existing config directories
  command: "mv {{ dotfiles_home }}/.config/{{ item.item }} {{ dotfiles_home }}/.config/{{ item.item }}.backup.{{ ansible_date_time.epoch }}"
  when: item.stat.exists and item.stat.isdir
  with_items: "{{ config_dir_stats.results }}"
  tags: ['dotfiles-prep']

- name: Remove existing config files (if they are regular files, not directories)
  file:
    path: "{{ dotfiles_home }}/.config/{{ item.item }}"
    state: absent
  when: item.stat.exists and not item.stat.isdir
  with_items: "{{ config_dir_stats.results }}"
  tags: ['dotfiles-prep']
