---
downloads: ~/.ansible-downloads/

configure_dotfiles: true
configure_osx: true

configure_dock: true
dockitems_remove:
  - Launchpad
  - TV
  - Safari
  - Maps
  - FaceTime
  - Contacts
  - Reminders
  - Notes
  - Music
  - Podcasts
  - News
  - "App Store"
  - Freeform

dockitems_persist:
  - name: "Firefox Developer Edition"
    path: "/Applications/Firefox Developer Edition.app"
    pos: 2
  - name: "Ghostty"
    path: "/Applications/Ghostty.app"
    pos: 5

configure_sudoers: true
sudoers_custom_config: |
  # Allow users in admin group to use sudo with no password.
  %admin ALL=(ALL) NOPASSWD: ALL

dotfiles_repo: https://github.com/ypo777/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/Developer/dotfiles
dotfiles_repo_version: main
dotfiles_repo_force: true
dotfiles_files:
  - .gitignore
  - .gitconfig
dotfiles_folder:
  - nvim
  - tmux
  - fish
homebrew_installed_packages:
  - git
  - tmux
  - fish
  - neovim
  - firefox@developer-edition
  - google-chrome
  - alt-tab
  - shottr
  - motrix
  - dbeaver-community
  - spotify
  - obs
  - pearcleaner
  - notion
  - fork
  - claude
  - discord
  - jordanbaird-ice
  - raspberry-pi-imager
  - mise

homebrew_taps: []

mas_installed_apps: []
mas_email: ""
mas_password: ""

osx_script: "~/.macos --no-restart"

composer_packages: []

gem_packages: []

npm_packages: []

pip_packages: []

post_provision_tasks:
  - "{{ playbook_dir }}/tasks/fish-setup.yml"
